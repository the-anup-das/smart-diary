name: Build and Publish Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      components: ${{ steps.build-matrix.outputs.components }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "base=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.prev_tag.outputs.base }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      # The matrix context is not allowed in a job-level `if`, so gate by
      # building the component list dynamically instead.
      - name: Compose build matrix
        id: build-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COMPONENTS='["backend","frontend"]'
          else
            COMPONENTS='[]'
            if [ "${{ steps.filter.outputs.backend }}" = "true" ]; then
              COMPONENTS=$(echo "$COMPONENTS" | jq -c '. + ["backend"]')
            fi
            if [ "${{ steps.filter.outputs.frontend }}" = "true" ]; then
              COMPONENTS=$(echo "$COMPONENTS" | jq -c '. + ["frontend"]')
            fi
          fi
          echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"

  # Each platform is built on a runner of its own architecture: amd64 on ubuntu-latest,
  # arm64 on GitHub's Arm runner. Nothing runs under QEMU, so `npm ci`, `next build` and
  # `pip install` go at native speed instead of hanging for hours in emulation.
  # Every build pushes its image by digest; the merge job below stitches the digests
  # into one multi-arch tag.
  build:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=${{ env.REGISTRY }}/${owner}/smart-diary-${{ matrix.component }}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One multi-arch manifest per component, tagged exactly as before.
  merge:
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - name: Prepare
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=${{ env.REGISTRY }}/${owner}/smart-diary-${{ matrix.component }}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # Releases should update :latest too — a NAS pulling :latest is the
            # primary consumer. Also tag with the literal git tag (works for
            # non-semver versions like v0.1.1.2, which type=semver skips).
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create the multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect the result
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
