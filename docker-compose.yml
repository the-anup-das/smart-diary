version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: diary-postgres
    restart: always
    environment:
      POSTGRES_USER: diary_user
      POSTGRES_PASSWORD: diary_password
      POSTGRES_DB: diary_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: diary-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv # Prevent Windows Host .venv from over-writing the Linux container!
    environment:
      # Natively maps Docker PostgreSQL DNS directly to SQLAlchemy
      - DATABASE_URL=postgresql://diary_user:diary_password@db:5432/diary_db
      - JWT_SECRET=super-secret-diary-key-you-should-change
      # LLM Strategy Toggle: Set to true to route traffic to local SGLang SLM
      - USE_LOCAL_LLM=${USE_LOCAL_LLM:-false}
      - LOCAL_LLM_BASE_URL=http://sglang:30000/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # STT: remove or leave blank to disable voice feature entirely
      - STT_BASE_URL=http://stt-server:8000/v1
      - STT_API_KEY=not-needed
      - STT_MODEL=${STT_MODEL:-Systran/faster-whisper-base.en}
    depends_on:
      - db
      - qdrant
      - stt-server
      # Notice sglang is removed from depends_on because it is now an optional profile

  # Phase 3: SGLang Local Inference Engine (NVIDIA GPU required)
  # NOTE: This service will ONLY start if you run: docker compose --profile local-ai up -d
  sglang:
    image: lmsysorg/sglang:latest
    container_name: diary-sglang
    profiles: ["local-ai"]
    restart: unless-stopped
    ports:
      - "30000:30000"
    volumes:
      # Mount the pipeline output dir into the container
      - ./data_pipeline/output:/models
    command: >
      python3 -m sglang.launch_server 
      --model-path /models/model_qwen_q4_k_m/unsloth.Q4_K_M.gguf 
      --port 30000 
      --chat-template chatml 
      --host 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: diary-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Whisper STT server — OpenAI-compatible /v1/audio/transcriptions
  # Remove STT_BASE_URL from backend env above to disable the voice feature
  stt-server:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: diary-stt
    restart: always
    environment:
      WHISPER__MODEL: "${STT_MODEL:-Systran/faster-whisper-base.en}"
      WHISPER__MODEL_LOAD_TTL: 1800  # unload from RAM after 30 min idle
      WHISPER__VAD_FILTER: "True"    # auto-filter silence and hallucinations
    ports:
      - "8001:8000"
    volumes:
      - stt_models:/root/.cache/huggingface  # persist downloaded model weights

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: diary-frontend
    ports:
      - "3000:3000"
    volumes:
      # Local volume mounted for rapid React hot-reloading
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - INTERNAL_BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - JWT_SECRET=super-secret-diary-key-you-should-change
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  stt_models:
